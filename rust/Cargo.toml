[package]
name = "bulker-rs"
version = "0.1.0"
edition = "2021"
description = "Rust port of Bulker: FastAPI+yt-dlp bulk audio downloader, now axum+SQLite"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
lofty = "0.22"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1
