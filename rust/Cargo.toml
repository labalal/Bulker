[package]
name = "bulker-rs"
version = "0.1.0"
edition = "2021"
description = "YouTube Music bulk audio downloader built with Axum and SQLite"
build = "build.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
lofty = "0.22"
uuid = { version = "1", features = ["v4", "fast-rng"] }
anyhow = "1"
mimalloc = "0.1"
rustc-hash = "2.1.3"
regex = "1.10"
once_cell = "1.19"
urlencoding = "2.1"
ureq = { version = "2.7", features = ["json"] }
ratatui = { version = "0.28", features = ["crossterm"] }
crossterm = "0.28"
num_cpus = "1.16"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
bulker-adb-scanner = { path = "../adb_scanner" }

[build-dependencies]
num_cpus = "1.16"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
incremental = false
debug = false

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
